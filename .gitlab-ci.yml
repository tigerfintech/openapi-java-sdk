# Two-stage pipeline: unit (no credentials) / integration (real API).
# Unit stage does NOT inject any credential variables.

stages:
  - unit
  - integration

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

.maven_base:
  image: maven:3.8-eclipse-temurin-8
  tags:
    - openapi
  before_script:
    - mkdir -p ~/.m2 && echo '<settings><mirrors><mirror><id>aliyun</id><mirrorOf>central</mirrorOf><url>https://maven.aliyun.com/repository/public</url></mirror></mirrors></settings>' > ~/.m2/settings.xml
  cache:
    key: maven-repo
    paths:
      - .m2/repository

unit:java:
  extends: .maven_base
  stage: unit
  script:
    - mvn $MAVEN_CLI_OPTS test
    - >-
      awk -F, 'NR>1 {miss+=$8; cov+=$9} END {if (cov+miss==0) {print "Total line coverage: 0.0%"; exit} printf "Total line coverage: %.1f%%\n", cov*100/(cov+miss)}'
      target/site/jacoco/jacoco.csv
  coverage: '/Total line coverage: ([0-9.]+)%/'
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    expire_in: 1 week

integration:java:
  extends: .maven_base
  stage: integration
  allow_failure: true
  tags:
    - sdk-integ
  script:
    - test -n "$TIGEROPEN_PROPS_PATH" || { echo "TIGEROPEN_PROPS_PATH not set — skipping integration"; exit 1; }
    - mvn $MAVEN_CLI_OPTS test-compile
    - mvn $MAVEN_CLI_OPTS failsafe:integration-test failsafe:verify -Dtest.integ=true
  artifacts:
    when: always
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
    expire_in: 1 week

# Pipeline result notification via a generic webhook (Feishu/Lark incoming
# webhook). WEBHOOK_URL is a masked CI Variable set in GitLab Settings; forks
# and PRs that don't configure it skip silently. notify failure never blocks.
notify:webhook:
  stage: .post
  when: always
  allow_failure: true
  dependencies: []
  script:
    - |
      if [ -z "$WEBHOOK_URL" ]; then
        echo "WEBHOOK_URL not configured, skipping notification"
        exit 0
      fi
      API="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}"
      JOBS_JSON=$(curl --fail -sS --max-time 10 --header "JOB-TOKEN: ${CI_JOB_TOKEN}" "${API}/pipelines/${CI_PIPELINE_ID}/jobs" 2>/dev/null || echo "")
      # Decide pass/fail from job statuses rather than CI_PIPELINE_STATUS,
      # which may still read "running" in a .post when:always job (GitLab
      # known behaviour). jobs API returns name+status only — no trace/secrets.
      # allow_failure soft-fails don't block the pipeline, so don't list them.
      HAS_FAILED="no"
      FAILED_JOBS=""
      if [ -n "$JOBS_JSON" ] && command -v python3 >/dev/null 2>&1; then
        OUT=$(printf '%s' "$JOBS_JSON" | python3 -c "import sys,json
      try:
        js=json.load(sys.stdin)
        failed=[j['name'] for j in js if j.get('status')=='failed' and not j.get('allow_failure')]
        print('yes' if failed else 'no')
        print(', '.join(failed))
      except Exception:
        print('no'); print('')
      " 2>/dev/null)
        HAS_FAILED=$(printf '%s\n' "$OUT" | sed -n '1p')
        FAILED_JOBS=$(printf '%s\n' "$OUT" | sed -n '2p')
      else
        echo "jobs API or python3 unavailable, falling back to CI_PIPELINE_STATUS"
        if [ "$CI_PIPELINE_STATUS" != "success" ]; then HAS_FAILED="yes"; fi
      fi
      TITLE="✅ Pipeline passed"
      COLOR="green"
      if [ "$HAS_FAILED" = "yes" ]; then
        TITLE="❌ Pipeline failed"
        COLOR="red"
      fi
      CONTENT="**Repo:** ${CI_PROJECT_NAME}\n**Branch:** ${CI_COMMIT_REF_NAME}\n**Commit:** ${CI_COMMIT_SHORT_SHA}\n"
      if [ -n "$FAILED_JOBS" ]; then
        CONTENT="${CONTENT}\n**Failed jobs:** ${FAILED_JOBS}\n"
      fi
      CONTENT="${CONTENT}[View pipeline](${CI_PROJECT_URL}/-/pipelines/${CI_PIPELINE_ID})"
      PAYLOAD=$(cat <<EOF
      {
        "msg_type": "interactive",
        "card": {
          "header": {
            "title": {"tag": "plain_text", "content": "$TITLE #${CI_PIPELINE_IID} — ${CI_PROJECT_NAME}"},
            "template": "$COLOR"
          },
          "elements": [
            {"tag": "div", "text": {"tag": "lark_md", "content": "$CONTENT"}}
          ]
        }
      }
      EOF
      )
      curl --fail -sS --max-time 10 -X POST "$WEBHOOK_URL" \
        -H 'Content-Type: application/json' \
        -d "$PAYLOAD"

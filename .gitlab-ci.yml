# Three-stage pipeline: unit (no credentials) / contract (read-only) / integ (write, manual).
# Unit stage does NOT inject any credential variables.

stages:
  - unit
  - contract
  - integ

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository -Dorg.slf4j.simpleLogger.log.org.apache.maven.cli.transfer.Slf4jMavenTransferListener=warn"
  MAVEN_CLI_OPTS: "--batch-mode --no-transfer-progress"

.maven_base:
  image: maven:3.8-eclipse-temurin-8
  cache:
    key: maven-repo
    paths:
      - .m2/repository

unit:java:
  extends: .maven_base
  stage: unit
  script:
    - mvn $MAVEN_CLI_OPTS test
    - >-
      awk -F, 'NR>1 {miss+=$8; cov+=$9} END {printf "Total line coverage: %.1f%%\n", cov*100/(cov+miss)}'
      target/site/jacoco/jacoco.csv
  coverage: '/Total line coverage: ([0-9.]+)%/'
  artifacts:
    when: always
    paths:
      - target/site/jacoco/
    reports:
      junit:
        - target/surefire-reports/TEST-*.xml
    expire_in: 1 week

# Read/write split via JUnit Category: ReadOnlyApi (contract) vs WriteApi (integ).
.integ_vars: &integ_vars
  READ_ONLY_GROUP: "com.tigerbrokers.stock.openapi.client.testsupport.ReadOnlyApi"
  WRITE_GROUP: "com.tigerbrokers.stock.openapi.client.testsupport.WriteApi"

# Integration credentials: TIGEROPEN_PROPS_PATH points to config dir on runner.
# Uses failsafe goals directly (not mvn verify, which triggers GPG signing).

contract:java:
  extends: .maven_base
  stage: contract
  variables:
    <<: *integ_vars
  script:
    - mvn $MAVEN_CLI_OPTS test-compile
    - mvn $MAVEN_CLI_OPTS failsafe:integration-test failsafe:verify
      -Dtest.integ=true
      -Dgroups="$READ_ONLY_GROUP"
      -DexcludedGroups="$WRITE_GROUP"
      -Dtest.config.path="$TIGEROPEN_PROPS_PATH"
  artifacts:
    when: always
    reports:
      junit:
        - target/failsafe-reports/TEST-*.xml
    expire_in: 1 week

integ:java:
  extends: .maven_base
  stage: integ
  when: manual
  allow_failure: true
  variables:
    <<: *integ_vars
  script:
    - mvn $MAVEN_CLI_OPTS test-compile
    - mvn $MAVEN_CLI_OPTS failsafe:integration-test failsafe:verify
      -Dtest.integ=true
      -Dgroups="$WRITE_GROUP"
      -Dtest.config.path="$TIGEROPEN_PROPS_PATH"
